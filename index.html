    /* EVENT CARD 3-SEGMENT STYLE (EARTHY AUROVILLE THEME) */

    /* Clean, non-bubble, modern loading status indicator */
    #chat-status-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;

    }
    .status-spinner {
        width: 14px;
        height: 14px;

        border-top: 2px solid var(--accent);
        border-radius: 50%;
        animation: statusSpin 0.8s linear infinite;
        flex-shrink: 0;

    @keyframes statusFadeIn {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes statusSpin {
        0% { transform: rotate(0deg); }

<script>
    // Safe storage helper with window.name fallback for environments with blocked third-party storage (e.g. iframes)
    function safeGetItem(key, defaultValue = "") {
        try {
            const val = localStorage.getItem(key);
            if (val !== null) return val;
        } catch (e) {}
        try {
            const store = JSON.parse(window.name || "{}");
            return store[key] !== undefined ? store[key] : defaultValue;
        } catch (e) {
            return defaultValue;
        }
    }

    function safeSetItem(key, value) {
        try {
            localStorage.setItem(key, value);
        } catch (e) {}
        try {
            const store = JSON.parse(window.name || "{}");
            store[key] = value;
            window.name = JSON.stringify(store);
        } catch (e) {}
    }

    function safeRemoveItem(key) {
        try {
            localStorage.removeItem(key);
        } catch (e) {}
        try {
            const store = JSON.parse(window.name || "{}");
            delete store[key];
            window.name = JSON.stringify(store);
        } catch (e) {}
    }

    // Check for start new session requested from another page
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('new_session') === 'true') {
        safeRemoveItem("auro_session_id");
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    let ws;
    let currentBotDiv = null;
    const chatWin = document.getElementById('chat-window');

    let presets = [];
    let currentSavitriQuote = null;

    async function fetchSavitriQuote() {
        try {
            const res = await fetch("/api/savitri-quote?t=" + Date.now());
            const data = await res.json();
            if (data.success) {
                currentSavitriQuote = data;
                renderSavitriQuote();
            }
        } catch (e) {
            console.error("Error fetching Savitri quote:", e);
        }
    }

    function renderSavitriQuote() {
        if (!currentSavitriQuote) return;
        
        // Remove existing if any to avoid duplicates
        const existing = document.getElementById("savitri-quote-card");
        if (existing) existing.remove();
        
        const card = document.createElement("div");
        card.id = "savitri-quote-card";
        card.className = "savitri-card";
        
        const headerDiv = document.createElement("div");
        headerDiv.className = "savitri-card-header";
        headerDiv.innerHTML = `✨ Savitri Verse for Reflection`;
        card.appendChild(headerDiv);
        
        const textDiv = document.createElement("div");
        textDiv.className = "savitri-quote-text";
        
        currentSavitriQuote.lines.forEach(line => {
            const p = document.createElement("p");
            p.style.margin = "0 0 0.25rem 0";
            p.textContent = `“${line}”`;
            textDiv.appendChild(p);
        });
        
        const citationDiv = document.createElement("div");
        citationDiv.className = "savitri-author-citation";
        citationDiv.innerHTML = `— Sri Aurobindo, <em>Savitri</em> (${currentSavitriQuote.book} • ${currentSavitriQuote.canto})`;
        
        card.appendChild(textDiv);
        card.appendChild(citationDiv);
        
        // Prepend to chat window so it is always at the very top
        if (chatWin.firstChild) {
            chatWin.insertBefore(card, chatWin.firstChild);
        } else {
            chatWin.appendChild(card);
        }
    }

    function showStatus(statusText) {
        if (!statusText) {
            hideStatus();
            return;
        }
        
        let indicator = document.getElementById("chat-status-indicator");
        if (!indicator) {
            indicator = document.createElement("div");
            indicator.id = "chat-status-indicator";
            
            const spinner = document.createElement("div");
            spinner.className = "status-spinner";
            indicator.appendChild(spinner);
            
            const textSpan = document.createElement("span");
            textSpan.id = "chat-status-text";
            indicator.appendChild(textSpan);
            
            chatWin.appendChild(indicator);
        }
        
        const textSpan = indicator.querySelector("#chat-status-text");
        if (textSpan) {
            textSpan.textContent = statusText;
        }
        
        // Auto-scroll to show the status indicator
        chatWin.scrollTop = chatWin.scrollHeight;
    }

    function hideStatus() {
        const indicator = document.getElementById("chat-status-indicator");
        if (indicator) {
            indicator.remove();
        }
    }

    async function loadPresets() {
        try {
            const res = await fetch("/api/presets");
            const data = await res.json();
            if (data.success && data.presets) {
                presets = data.presets;
                updatePresetsVisibility();
            }
        } catch (e) {
            console.error("Error loading presets:", e);
        }
    }

    function renderWelcomePresets(botDiv) {
        // Obsolete, presets are now always in the horizontal scrolling presets bar
    }

    function updatePresetsVisibility() {
        const presetsBar = document.getElementById('presets-bar');
        if (!presetsBar) return;
        
        if (presets.length > 0) {
            presetsBar.style.display = 'block';
            const inner = presetsBar.querySelector('.presets-bar-inner');
            if (inner) {
                inner.innerHTML = '';
                presets.forEach(p => {
                    const btn = document.createElement('button');
                    btn.className = 'preset-btn';
                    btn.textContent = p.text;
                    btn.onclick = () => send(p.query);
                    inner.appendChild(btn);
                });
            }
        } else {
            presetsBar.style.display = 'none';
        }
    }

    function startNewSession() {
        safeRemoveItem("auro_session_id");
        window.location.href = window.location.pathname + "?new_session=true&t=" + Date.now();
    }
    window.startNewSession = startNewSession;

    function connect() {
        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
        
        let sessionId = safeGetItem("auro_session_id") || "sess_" + Math.random().toString(36).substr(2, 9);
        safeSetItem("auro_session_id", sessionId);

        const currentHost = window.location.host;
        // Fix ws scheme logic to always use Secure Websockets correctly
        const scheme = window.location.protocol === "https:" ? "wss" : "ws";
        const wsTarget = currentHost;

        ws = new WebSocket(`${scheme}://${wsTarget}/ws/chat/${sessionId}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === "history_load") {
                hideStatus();
                chatWin.innerHTML = ""; 
                renderSavitriQuote(); // Always prepend the beautiful Savitri quote card at the very top of the conversation
                data.content.forEach(msg => appendMsg(msg.role === "user" ? "user" : "bot", msg.content, false));
                chatWin.scrollTop = chatWin.scrollHeight;
                updatePresetsVisibility();
            } 
            else if (data.type === "welcome" || data.type === "static_response") {
                hideStatus();
                let content = data.content;
                // Strip Savitri text from welcome message content if it contains it to avoid duplication
                if (data.type === "welcome" && content.includes("\n\n---\n\n✨ **Savitri Verse for Reflection** ✨")) {
                    content = content.split("\n\n---\n\n✨ **Savitri Verse for Reflection** ✨")[0];
                }
                
                // If welcome message is already pre-rendered, update it and skip appending duplicates or scrolling
                if (data.type === "welcome" && document.getElementById("welcome-message-bubble")) {
                    const welcomeBubble = document.getElementById("welcome-message-bubble");
                    const contentDiv = welcomeBubble.querySelector('.msg-content');
                    if (contentDiv) {
                        contentDiv.innerHTML = marked.parse(content || "", { breaks: true });
                        format3SegmentEventCards(contentDiv);
                    }
                    return;
                }

                const botDiv = appendMsg('bot', content);
                if (data.type === "welcome") {
                    botDiv.id = "welcome-message-bubble";
                }
            }
            else if (data.type === "modal") {
                openModal(data.content); 
            } 
            else if (data.type === "status") {
                showStatus(data.status);
            }
            else if (data.type === "start_stream") {
                hideStatus();
                currentBotDiv = appendMsg('bot', '');
            } 
            else if (data.type === "stream_chunk") {
                hideStatus();
                if (currentBotDiv) {
                    let targetDiv = currentBotDiv.querySelector('.msg-content') || currentBotDiv;
                    targetDiv.innerHTML = marked.parse(data.chunk, { breaks: true });
                    format3SegmentEventCards(targetDiv);
                    // Do not auto-scroll to the bottom during streaming to let the user scroll by themselves
                }
            }
        };
    }

    function format3SegmentEventCards(container) {
        if (!container) return;
        container.querySelectorAll('p').forEach(p => {
            if (p.querySelector('a[href^="#DETAILS::"]')) {
                p.classList.add('event-card');
                
                // Format into 3 distinct horizontal segments if not already done
                if (!p.querySelector('.ec-above-title')) {
                    const topBar = p.querySelector('.ec-topbar');
                    const titleStrong = p.querySelector('strong');
                    
                    // Segment 1: Above Title
                    const aboveDiv = document.createElement('div');
                    aboveDiv.className = 'ec-segment ec-above-title';
                    if (topBar) {
                        aboveDiv.appendChild(topBar);
                    } else {
                        aboveDiv.innerHTML = '<div class="ec-topbar"><span class="ec-type">EVENT</span></div>';
                    }
                    
                    // Segment 2: Title
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'ec-segment ec-title-segment';
                    if (titleStrong) {
                        titleDiv.appendChild(titleStrong);
                    }
                    
                    // Segment 3: Below Title
                    const belowDiv = document.createElement('div');
                    belowDiv.className = 'ec-segment ec-below-title';
                    
                    while (p.firstChild) {
                        const node = p.firstChild;
                        if (node.nodeName === 'BR') {
                            p.removeChild(node);
                        } else {
                            belowDiv.appendChild(node);
                        }
                    }
                    
                    p.appendChild(aboveDiv);
                    p.appendChild(titleDiv);
                    p.appendChild(belowDiv);
                }

                addSwipeLogic(p);
                p.onclick = function(e) {
                    if (e.target.tagName !== 'A') {
                        const link = p.querySelector('a');
                        if (link) link.click();
                    }
                };
            }
        });
    }

    function addSwipeLogic(el) {
        if (el.dataset.swipeAdded) return;
        el.dataset.swipeAdded = "true";
        let startX = 0;
        let currentX = 0;
        let isDragging = false;
        
        el.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            el.style.transition = 'none';
        }, {passive: true});
        
        el.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diffX = e.touches[0].clientX - startX;
            // Only allow swiping left
            if (diffX < 0) {
                currentX = diffX;
                el.style.transform = `translateX(${currentX}px)`;
            }
        }, {passive: true});
        
        el.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            el.style.transition = 'transform 0.3s ease';
            if (currentX < -80) { // Swiped enough to trigger
                el.style.transform = 'translateX(-100vw)';
                setTimeout(() => {
                    const link = el.querySelector('a');
                    if (link) link.click();
                    // Reset position after clicking
                    setTimeout(() => {
                        el.style.transform = 'translateX(0)';
                    }, 100);
                }, 200);
            } else {
                el.style.transform = 'translateX(0)';
            }
            currentX = 0;
        }, {passive: true});
    }

    function appendMsg(role, text, shouldScroll = true) {
        if (!text && role !== 'bot') return;
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        
        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';
        contentDiv.innerHTML = marked.parse(text || "", { breaks: true });
        
        format3SegmentEventCards(contentDiv);
        
        div.appendChild(contentDiv);
        
        chatWin.appendChild(div);
        if (shouldScroll) {
            if (role === 'user') {
                chatWin.scrollTop = chatWin.scrollHeight;
            } else {
                // Scroll to the start/top of the bot's reply so the user starts reading from the top
                chatWin.scrollTop = div.offsetTop - 20;
            }
        }
        
        // Update presets bar visibility when a message is appended
        updatePresetsVisibility();
        
        return div;
    }

    async function send(msg = null) {
        const text = msg || document.getElementById('user-input').value.trim();
        if (!text) return;
        if (!msg) document.getElementById('user-input').value = ''; 
        try {
            connect();
            while (ws.readyState !== WebSocket.OPEN) await new Promise(r => setTimeout(r, 50));
            appendMsg('user', text);
            showStatus("Analyzing query...");
            ws.send(JSON.stringify({ 
                message: text, 
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone 
            }));
        } catch (err) {
            appendMsg('bot', '⚠️ Error connecting.');
        }
    }

    chatWin.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (a && a.getAttribute('href')?.startsWith('#')) {
            e.preventDefault();
            const href = a.getAttribute('href');
            if (href.startsWith('#DETAILS::')) {
                const uuid = href.split('::')[1];
                let eventTitle = a.textContent || "event";
                let slug = eventTitle.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                window.location.href = `/event/${slug}-${uuid}`;
            }
            else if (href.includes('SHOWDAILY')) send('show daily events');
            else if (href.includes('NODAILY')) send('No, thank you');
        }
    });

    document.getElementById('send-btn').onclick = () => send();
    document.getElementById('user-input').onkeydown = (e) => { if(e.key === 'Enter') send(); };

    const initialWelcomeText = `🌟 Welcome to Auroville Explorer! 🌟

I am your AI companion, here to help you explore and experience Auroville. 🌿✨

Auroville is a place to experience yourself and the world differently—to grow, create, and connect.

Whether you're visiting, volunteering, newly arrived, or have been part of the community for years, there's always something new to discover and learn.

<br>

🧘 Deepen within through meditation and talks on the works of Sri Aurobindo.  
🎨 Immerse in creativity through art exhibitions, pottery, writing, and cultural workshops.  
🎶 Feel the rhythm with music concerts, choir, and dance classes.  
🌱 Reconnect with nature through forest walks, permaculture, and eco-living workshops.  
💆 Heal and rejuvenate through Ayurveda, Reiki, massage, and movement therapies.  
🤝 Be part of the community through learning, volunteering, and sharing circles.

<br>

Curious about Auroville or looking for something specific? Just ask.

Let's explore Auroville together. 💫`;

    function preRenderWelcome() {
        if (chatWin.querySelector('.msg.bot') || document.getElementById('welcome-message-bubble')) {
            return;
        }
        const botDiv = appendMsg('bot', initialWelcomeText, false);
        botDiv.id = "welcome-message-bubble";
    }

    preRenderWelcome();
    fetchSavitriQuote();
    connect();
    loadPresets();
</script>
<script src="/common.js" type="module"></script>
</body>
