<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | AuroConnect</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
    :root { 
        --accent: #C85A32; 
        --bg: #F5F0EB; 
        --surface: #FFFFFF;
        --text: #3D2314;
        --text-secondary: #6E5D4F;
        --border: #E6DDD5;
        --user-msg-bg: #EEF2ED;
        --input-border: #D8CEC4;
        --shadow: rgba(61, 35, 20, 0.08);
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #1A1715; 
            --surface: #24201D; 
            --text: #F5E8DF; 
            --text-secondary: #C4B5A5; 
            --border: #3A342E;
            --user-msg-bg: #232B25; 
            --accent: #E07A5F; 
            --input-border: #483F37;
            --shadow: rgba(0,0,0,0.4);
        }
    }

    html, body {
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background: var(--bg); 
        color: var(--text);
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        touch-action: pan-y;
        overscroll-behavior: none;
    }

    /* Fullscreen Overlay Backdrop */
    #main-content {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(30, 20, 15, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        opacity: 0;
        animation: sheetFadeIn 0.25s ease-out forwards;
        box-sizing: border-box;
    }

    @keyframes sheetFadeIn {
        to { opacity: 1; }
    }

    /* Bottom Sliding Sheet Container */
    .details-container {
        width: 100%;
        max-width: 680px;
        background: var(--surface);
        border-top-left-radius: 24px;
        border-top-right-radius: 24px;
        border: 1px solid var(--border);
        border-bottom: none;
        box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.25);
        max-height: 80vh;
        height: fit-content;
        display: flex;
        flex-direction: column;
        position: relative;
        transform: translateY(100%);
        animation: sheetSlideUp 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        box-sizing: border-box;
        overflow: hidden;
    }

    @keyframes sheetSlideUp {
        to { transform: translateY(0); }
    }

    /* Sticky Drag Handle Header */
    .sheet-header-bar {
        padding: 10px 18px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        position: sticky;
        top: 0;
        z-index: 10;
        user-select: none;
    }

    .sheet-handle {
        width: 44px;
        height: 5px;
        background: var(--border);
        border-radius: 3px;
        margin-bottom: 10px;
        cursor: grab;
        transition: background 0.2s;
    }

    .sheet-handle:active {
        cursor: grabbing;
        background: var(--accent);
    }

    .sheet-top-controls {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .sheet-title-badge {
        font-size: 1.08rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.3;
        letter-spacing: -0.015em;
        max-width: 95%;
        text-align: center;
        margin: 2px 0 4px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* Scrollable Event Content inside Sheet */
    #event-content {
        overflow-y: auto;
        overscroll-behavior: contain;
        flex: 1 1 auto;
        min-height: 0;
        padding: 0 0 32px;
        box-sizing: border-box;
    }

    .event-card {
        color: var(--text);
        font-size: 0.95rem;
        display: block;
        width: 100%;
        box-sizing: border-box;
        background: var(--surface);
        border: none;
        padding: 0;
        margin: 0;
        box-shadow: none;
        line-height: 1.4;
        position: relative;
    }

    /* Segment 1: Above Title (Muted & Subdued) */
    .ec-segment.ec-above-title {
        background: #F9F6F3;
        padding: 10px 16px;
        border-bottom: 1px solid #ECE5DE;
        opacity: 1;
    }

    /* Segment 2: Title (Matching Segment 1 background & text color tone) */
    .ec-segment.ec-title-segment {
        background: #F9F6F3;
        padding: 12px 16px 12px 12px;
        border-bottom: 1px solid #ECE5DE;
        border-left: 4px solid #C85A32; /* Accent bar preserved */
    }

    /* Segment 3: Below Title (Soft Sage Tint) */
    .ec-segment.ec-below-title {
        background: #EEF2ED;
        padding: 12px 16px;
        font-size: 0.85rem;
        font-weight: 500;
        color: #26332A;
    }

    @media (prefers-color-scheme: dark) {
        .ec-segment.ec-above-title {
            background: #23201C;
            border-bottom-color: #332D27;
            opacity: 1;
        }
        .ec-segment.ec-title-segment {
            background: #23201C;
            border-bottom-color: #332D27;
            border-left: 4px solid #E07A5F;
        }
        .ec-segment.ec-below-title {
            background: #1C241E;
            color: #D8E4DC;
            font-weight: 500;
        }
    }

    .ec-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        width: 100%;
    }
    .ec-type {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.05em;
        color: #6E5D4F; /* Darker segment 1 text */
    }
    @media (prefers-color-scheme: dark) {
        .ec-type {
            color: #C4B5A5; /* Darker/clearer dark mode text */
        }
    }
    .ec-type em {
        font-style: normal;
    }
    .ec-date {
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.04em;
        color: #6E5D4F; /* Darker segment 1 text */
    }
    @media (prefers-color-scheme: dark) {
        .ec-date {
            color: #C4B5A5;
        }
    }
    .ec-title-segment strong {
        font-size: 1.1rem;
        font-weight: 700;
        color: #3D2314 !important; /* Deep Chestnut matching Segment 1 color tone */
        display: block;
        margin: 0 !important;
        line-height: 1.35;
    }
    @media (prefers-color-scheme: dark) {
        .ec-title-segment strong {
            color: #F5E8DF !important;
        }
    }

    .event-title {
        font-size: 1.05rem;
        color: var(--accent);
        display: block;
        margin-bottom: 3px;
        line-height: 1.25;
        font-weight: bold;
    }

    .detail-row {
        margin-bottom: 2px;
    }

    .detail-label {
        font-weight: 600;
        color: var(--text);
        display: inline-block;
        margin-right: 4px;
    }

    /* Media Gallery & Display */
    .media-gallery-container {
        margin-bottom: 16px;
        width: 100%;
        padding: 0;
    }

    .media-main-frame {
        width: 100%;
        height: 400px;
        background: rgba(0, 0, 0, 0.04);
        border-radius: 0;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-bottom: 1px solid var(--border);
        box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
        .media-main-frame {
            background: rgba(255, 255, 255, 0.04);
            border-bottom-color: var(--border);
        }
    }

    @media (max-width: 768px) {
        .media-main-frame {
            height: 300px;
        }
    }

    .main-display-img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        display: block !important;
        margin: 0 auto;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .main-display-img:hover {
        transform: scale(1.01);
    }

    .media-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0, 0, 0, 0.55);
        color: #ffffff;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        z-index: 3;
        transition: background 0.2s, transform 0.1s;
        user-select: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .media-nav-btn:hover {
        background: rgba(0, 0, 0, 0.8);
        transform: translateY(-50%) scale(1.08);
    }

    .media-nav-prev { left: 10px; }
    .media-nav-next { right: 10px; }

    .image-counter-badge {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.65);
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
        z-index: 3;
        letter-spacing: 0.03em;
    }

    .thumbnails-strip-container {
        margin-top: 10px;
    }

    .thumbnails-header {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .thumbnails-strip {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 8px 2px;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
    }

    .thumbnail-item {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        border: 2px solid transparent;
        opacity: 0.65;
        transition: all 0.2s ease;
        background: var(--bg);
        position: relative;
    }

    .thumbnail-item:hover {
        opacity: 0.9;
    }

    .thumbnail-item.active {
        border-color: var(--accent);
        opacity: 1;
        box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.25);
    }

    .thumbnail-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .main-media-view-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .pdf-media-wrapper {
        width: 100%;
        height: 100%;
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.03);
        border-radius: 0;
        overflow: hidden;
    }

    .pdf-canvas-display {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        display: block !important;
        margin: 0 auto;
        border-radius: 0;
        box-shadow: none;
    }

    .main-display-pdf {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
    }

    .pdf-click-overlay {
        position: absolute;
        bottom: 12px;
        left: 12px;
        z-index: 4;
        pointer-events: none;
    }

    .pdf-overlay-badge {
        background: rgba(0, 0, 0, 0.75);
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 12px;
        backdrop-filter: blur(4px);
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .pdf-thumb-label {
        position: absolute;
        bottom: 2px;
        right: 2px;
        background: rgba(200, 90, 50, 0.9);
        color: #ffffff;
        font-size: 0.55rem;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 3px;
        pointer-events: none;
    }

    .pdf-thumb-content {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--accent);
        font-size: 0.65rem;
        font-weight: 700;
        gap: 2px;
    }

    .lightbox-pdf-wrapper {
        width: 90vw;
        height: 72vh;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .lightbox-pdf-frame {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .lightbox-pdf-download-link {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 6px 16px;
        border-radius: 16px;
        font-size: 0.85rem;
        text-decoration: none;
        font-weight: 600;
        transition: background 0.2s;
    }

    .lightbox-pdf-download-link:hover {
        background: rgba(255, 255, 255, 0.35);
    }

    .lightbox-thumb.pdf-thumb {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        font-size: 0.65rem;
        font-weight: 700;
        gap: 2px;
        border-radius: 6px;
        width: 50px;
        height: 50px;
    }

    /* Lightbox Modal */
    .lightbox-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.92);
        z-index: 10000;
        display: none;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 16px;
        box-sizing: border-box;
        backdrop-filter: blur(8px);
        user-select: none;
    }

    .lightbox-modal.open {
        display: flex;
        animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .lightbox-topbar {
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #ffffff;
        z-index: 10002;
    }

    .lightbox-btn {
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s, transform 0.1s;
    }

    .lightbox-btn:hover {
        background: rgba(255, 255, 255, 0.3);
    }

    .lightbox-close-btn {
        width: 40px;
        height: 40px;
        padding: 0;
        justify-content: center;
        font-size: 1.2rem;
        border-radius: 50%;
    }

    .lightbox-title {
        font-size: 0.9rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
    }

    .lightbox-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        width: 100%;
        max-width: 1200px;
        margin: 12px 0;
    }

    .lightbox-img {
        max-width: 95vw;
        max-height: 75vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .lightbox-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.25);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        cursor: pointer;
        z-index: 10001;
        transition: background 0.2s;
    }

    .lightbox-nav-btn:hover {
        background: rgba(255, 255, 255, 0.35);
    }

    .lightbox-nav-prev { left: 10px; }
    .lightbox-nav-next { right: 10px; }

    .lightbox-bottombar {
        width: 100%;
        max-width: 1200px;
        display: flex;
        justify-content: center;
        padding-bottom: 8px;
    }

    .lightbox-thumbnails {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        max-width: 100%;
        padding: 6px;
        scrollbar-width: thin;
    }

    .lightbox-thumb {
        width: 50px;
        height: 50px;
        border-radius: 4px;
        object-fit: cover;
        cursor: pointer;
        opacity: 0.5;
        border: 2px solid transparent;
        transition: all 0.2s;
        flex-shrink: 0;
    }

    .lightbox-thumb.active {
        opacity: 1;
        border-color: #ffffff;
    }

    a {
        color: var(--accent);
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .description {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
        white-space: pre-wrap;
    }

    .action-buttons {
        display: flex;
        gap: 12px;
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
    }

    .action-btn {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: 500;
    }

    .action-btn:hover {
        background: var(--bg);
    }
    
    .back-btn-container {
        margin-bottom: 12px;
    }
    
    .back-btn {
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
    }

    .back-btn:hover {
        color: var(--text);
        text-decoration: underline;
    }

    .disclaimer {
        font-size: 0.65rem; 
        color: var(--text-secondary); 
        text-align: center;
        padding: 0.2rem 1rem 0.8rem 1rem; 
        background: var(--bg);
        line-height: 1.2;
    }

    @media (max-width: 768px) {
        #main-content {
            padding: 0 !important;
        }
        .details-container {
            width: 100% !important;
            max-width: 100% !important;
            border-radius: 16px 16px 0 0;
            border-left: none;
            border-right: none;
            max-height: 90vh;
        }
        #event-content {
            max-height: calc(90vh - 58px);
            padding: 0 0 24px !important;
        }
        .event-card {
            border-radius: 0;
            padding: 0 !important;
            margin: 0 !important;
        }
        .sheet-header-bar {
            padding: 8px 10px;
        }
        .sheet-title-badge {
            max-width: 100%;
            font-size: 1.05rem;
        }
        .media-gallery-container {
            margin-bottom: 12px;
        }
        .media-main-frame {
            width: 100%;
            height: 300px;
            border-radius: 0;
            border-left: none;
            border-right: none;
        }
        .main-display-img {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
        .pdf-canvas-display {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
        }
    }

    .floating-contact-container {
        position: fixed;
        right: 24px;
        bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 999;
    }

    .floating-contact-btn {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s, box-shadow 0.2s;
        text-decoration: none;
        position: relative;
    }

    .floating-contact-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    .floating-contact-btn:active {
        transform: scale(0.95);
    }

    .floating-contact-btn.whatsapp-btn {
        background: #25d366;
    }

    .floating-contact-btn.email-btn {
        background: #1a73e8;
    }

    @media (max-width: 600px) {
        .floating-contact-container {
            right: 16px;
            bottom: 16px;
            gap: 10px;
        }
        .floating-contact-btn {
            width: 48px;
            height: 48px;
        }
    }
    </style>
</head>
<body>

<div class="header"></div>

<div id="main-content" onclick="handleBackdropClick(event)">
    <div class="details-container" id="details-sheet" onclick="event.stopPropagation()">
        <div class="sheet-header-bar" id="sheet-header-bar">
            <div class="sheet-handle" title="Drag down to close"></div>
            <div class="sheet-top-controls">
                <!-- Top-most header title removed per user request -->
            </div>
        </div>
        <div id="event-header-container" style="flex: 0 0 auto; z-index: 10;"></div>
        <div id="event-content"></div>
    </div>
</div>

<!-- Fullscreen Lightbox Modal -->
<div id="lightbox-modal" class="lightbox-modal">
    <div class="lightbox-topbar">
        <span id="lightbox-title" class="lightbox-title">Image 1 of 1</span>
        <button type="button" class="lightbox-btn lightbox-close-btn" onclick="closeLightbox()" aria-label="Close Preview">✕</button>
    </div>
    <div class="lightbox-content" onclick="closeLightbox()" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event, true)">
        <img id="lightbox-img" class="lightbox-img" src="" alt="Full Screen View" onclick="event.stopPropagation()">
        <button type="button" class="lightbox-nav-btn lightbox-nav-prev" onclick="changeLightboxImage(-1, event)" aria-label="Previous Image">‹</button>
        <button type="button" class="lightbox-nav-btn lightbox-nav-next" onclick="changeLightboxImage(1, event)" aria-label="Next Image">›</button>
    </div>
    <div class="lightbox-bottombar">
        <div id="lightbox-thumbs" class="lightbox-thumbnails"></div>
    </div>
</div>

<div class="disclaimer"></div>

<div id="floating-contact-container" class="floating-contact-container"></div>

<script>
    const event = {{EVENT_DATA}};
    let currentImgIndex = 0;
    let eventImages = [];
    let eventDocs = [];
    let lightboxPushStateAdded = false;
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;

    let currentScale = 1;
    let startDist = 0;
    let initialScale = 1;
    let panX = 0, panY = 0;
    let startPanX = 0, startPanY = 0;
    let lastTapTime = 0;

    function resetZoom(imgEl) {
        currentScale = 1;
        panX = 0;
        panY = 0;
        if (imgEl) {
            imgEl.style.transform = "scale(1) translate(0px, 0px)";
        }
    }

    function applyTransform(imgEl) {
        if (!imgEl) return;
        imgEl.style.transform = `scale(${currentScale}) translate(${panX / currentScale}px, ${panY / currentScale}px)`;
    }

    function attachTouchZoomHandlers(imgEl) {
        if (!imgEl || imgEl._zoomAttached) return;
        imgEl._zoomAttached = true;

        imgEl.addEventListener("touchstart", (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                initialScale = currentScale;
            } else if (e.touches.length === 1) {
                touchStartX = e.touches[0].pageX;
                touchStartY = e.touches[0].pageY;
                startPanX = panX;
                startPanY = panY;

                const now = Date.now();
                if (now - lastTapTime < 300) {
                    if (currentScale > 1) {
                        resetZoom(imgEl);
                    } else {
                        currentScale = 2.5;
                        panX = 0;
                        panY = 0;
                        applyTransform(imgEl);
                    }
                    lastTapTime = 0;
                    e.preventDefault();
                    return;
                }
                lastTapTime = now;
            }
        }, { passive: false });

        imgEl.addEventListener("touchmove", (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const currentDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                if (startDist > 0) {
                    currentScale = Math.min(Math.max(1, initialScale * (currentDist / startDist)), 4);
                    if (currentScale === 1) { panX = 0; panY = 0; }
                    applyTransform(imgEl);
                }
            } else if (e.touches.length === 1 && currentScale > 1) {
                e.preventDefault();
                const deltaX = e.touches[0].pageX - touchStartX;
                const deltaY = e.touches[0].pageY - touchStartY;
                panX = startPanX + deltaX;
                panY = startPanY + deltaY;
                applyTransform(imgEl);
            }
        }, { passive: false });

        imgEl.addEventListener("touchend", (e) => {
            if (e.touches.length < 2) {
                startDist = 0;
            }
            if (currentScale < 1.05) {
                resetZoom(imgEl);
            }
        });
    }

    function isPdf(url) {
        if (!url || typeof url !== 'string') return false;
        const clean = url.split('?')[0].toLowerCase();
        return clean.endsWith('.pdf') || clean.includes('.pdf');
    }

    function initMedia() {
        let allMedia = [];
        if (Array.isArray(event.mediaUrls)) {
            allMedia = event.mediaUrls.filter(Boolean);
        } else if (typeof event.mediaUrls === 'string' && event.mediaUrls) {
            allMedia = event.mediaUrls.split(',').map(s => s.trim()).filter(Boolean);
        }

        if (event.posterUrl) {
            const posterList = typeof event.posterUrl === 'string'
                ? event.posterUrl.split(',').map(s => s.trim()).filter(Boolean)
                : (Array.isArray(event.posterUrl) ? event.posterUrl : [event.posterUrl]);
            posterList.forEach(url => {
                if (!allMedia.includes(url)) {
                    allMedia.push(url);
                }
            });
        }

        eventImages = allMedia.filter(url => {
            const lower = url.toLowerCase();
            return !lower.includes('.doc') && !lower.includes('.ppt') && !lower.includes('.xls');
        });

        eventDocs = allMedia.filter(url => {
            const lower = url.toLowerCase();
            return lower.includes('.doc') || lower.includes('.ppt') || lower.includes('.xls');
        });
    }

    function renderPdfToCanvas(pdfUrl, canvasEl, options) {
        options = options || {};
        if (!canvasEl || !pdfUrl) return;

        if (typeof pdfjsLib === 'undefined') {
            setTimeout(() => renderPdfToCanvas(pdfUrl, canvasEl, options), 200);
            return;
        }

        try {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            const proxyUrl = '/api/pdf-proxy?url=' + encodeURIComponent(pdfUrl);
            const loadingTask = pdfjsLib.getDocument(proxyUrl);
            loadingTask.promise.then(function(pdf) {
                return pdf.getPage(options.page || 1);
            }).then(function(page) {
                const scale = options.scale || 1.8;
                const viewport = page.getViewport({ scale: scale });
                const context = canvasEl.getContext('2d');
                canvasEl.height = viewport.height;
                canvasEl.width = viewport.width;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                return page.render(renderContext).promise;
            }).catch(function(err) {
                console.warn("PDF.js render error:", err);
                if (options.onError) options.onError(err);
            });
        } catch (e) {
            console.warn("PDF.js exception:", e);
            if (options.onError) options.onError(e);
        }
    }

    function selectImage(index) {
        if (index < 0 || index >= eventImages.length) return;
        currentImgIndex = index;
        const currentUrl = eventImages[currentImgIndex];
        const mainFrame = document.getElementById("media-main-frame");

        if (mainFrame) {
            let container = document.getElementById("main-media-view-container");
            if (!container) {
                container = document.createElement("div");
                container.id = "main-media-view-container";
                container.className = "main-media-view-container";
                mainFrame.insertBefore(container, mainFrame.firstChild);
            }

            if (isPdf(currentUrl)) {
                container.innerHTML = `
                    <div class="pdf-media-wrapper" onclick="openLightbox(currentImgIndex)">
                        <canvas id="main-pdf-canvas" class="pdf-canvas-display"></canvas>
                        <div class="pdf-click-overlay">
                            <span class="pdf-overlay-badge">📄 PDF Document • Tap for Full View</span>
                        </div>
                    </div>`;
                const mainCanvas = document.getElementById("main-pdf-canvas");
                renderPdfToCanvas(currentUrl, mainCanvas, {
                    scale: 1.8,
                    onError: () => {
                        container.innerHTML = `
                            <div class="pdf-media-wrapper" onclick="openLightbox(currentImgIndex)">
                                <iframe class="main-display-pdf" src="https://docs.google.com/gview?url=${encodeURIComponent(currentUrl)}&embedded=true" title="PDF Document"></iframe>
                                <div class="pdf-click-overlay">
                                    <span class="pdf-overlay-badge">📄 Tap for Full View</span>
                                </div>
                            </div>`;
                    }
                });
            } else {
                container.innerHTML = `
                    <img id="main-display-image" class="main-display-img" src="${currentUrl}" alt="${event.title || 'Event Image'}" onclick="openLightbox(currentImgIndex)">`;
                const imgEl = document.getElementById("main-display-image");
                if (imgEl) attachTouchZoomHandlers(imgEl);
            }
        }

        const badgeEl = document.getElementById("image-counter-badge");
        if (badgeEl) {
            badgeEl.textContent = `${currentImgIndex + 1} of ${eventImages.length}`;
        }
        eventImages.forEach((_, idx) => {
            const thumb = document.getElementById(`thumb-${idx}`);
            if (thumb) {
                if (idx === currentImgIndex) {
                    thumb.classList.add("active");
                    thumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                } else {
                    thumb.classList.remove("active");
                }
            }
        });
    }

    function changeImage(dir, e) {
        if (e) e.stopPropagation();
        if (eventImages.length === 0) return;
        let newIdx = currentImgIndex + dir;
        if (newIdx < 0) newIdx = eventImages.length - 1;
        if (newIdx >= eventImages.length) newIdx = 0;
        selectImage(newIdx);
    }

    function openLightbox(index) {
        if (eventImages.length === 0) return;
        currentImgIndex = (typeof index === 'number') ? index : 0;
        const modal = document.getElementById("lightbox-modal");
        if (!modal) return;
        
        updateLightboxView();
        modal.classList.add("open");
        document.body.style.overflow = "hidden";

        try {
            history.pushState({ lightboxOpen: true }, "");
            lightboxPushStateAdded = true;
        } catch (err) {}
    }

    function closeLightbox(fromPopState) {
        const modal = document.getElementById("lightbox-modal");
        if (!modal || !modal.classList.contains("open")) return;
        
        modal.classList.remove("open");
        document.body.style.overflow = "";

        const lightboxImg = document.getElementById("lightbox-img");
        if (lightboxImg) resetZoom(lightboxImg);

        if (lightboxPushStateAdded && !fromPopState) {
            lightboxPushStateAdded = false;
            try {
                history.back();
            } catch (err) {}
        }
    }

    function updateLightboxView() {
        const lightboxContainer = document.querySelector(".lightbox-content");
        if (!lightboxContainer) return;
        
        const currentUrl = eventImages[currentImgIndex];
        const isCurrentPdf = isPdf(currentUrl);

        let contentEl = document.getElementById("lightbox-media-display");
        if (!contentEl) {
            contentEl = document.createElement("div");
            contentEl.id = "lightbox-media-display";
            contentEl.style.width = "100%";
            contentEl.style.height = "100%";
            contentEl.style.display = "flex";
            contentEl.style.alignItems = "center";
            contentEl.style.justifyContent = "center";
            lightboxContainer.innerHTML = '';
            lightboxContainer.appendChild(contentEl);
        }

        if (isCurrentPdf) {
            contentEl.innerHTML = `
                <div class="lightbox-pdf-wrapper">
                    <div style="flex:1; width:100%; display:flex; align-items:center; justify-content:center; overflow:auto; position:relative;">
                        <canvas id="lightbox-pdf-canvas" style="max-width:100%; max-height:75vh; object-fit:contain; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.5);"></canvas>
                    </div>
                    <a href="${currentUrl}" target="_blank" class="lightbox-pdf-download-link" onclick="event.stopPropagation()">
                        <span>Open Original PDF in New Tab</span> ↗
                    </a>
                </div>`;
            const lightboxCanvas = document.getElementById("lightbox-pdf-canvas");
            renderPdfToCanvas(currentUrl, lightboxCanvas, { scale: 2.2 });
        } else {
            contentEl.innerHTML = `<img id="lightbox-img" class="lightbox-img" src="${currentUrl}" alt="Full size image">`;
            const lightboxImg = document.getElementById("lightbox-img");
            if (lightboxImg) {
                resetZoom(lightboxImg);
                attachTouchZoomHandlers(lightboxImg);
            }
        }

        const titleEl = document.getElementById("lightbox-title");
        if (titleEl) {
            titleEl.textContent = `${isCurrentPdf ? 'PDF' : 'Media'} ${currentImgIndex + 1} of ${eventImages.length}`;
        }
        
        const prevBtn = document.querySelector(".lightbox-nav-prev");
        const nextBtn = document.querySelector(".lightbox-nav-next");
        if (prevBtn && nextBtn) {
            prevBtn.style.display = eventImages.length > 1 ? "flex" : "none";
            nextBtn.style.display = eventImages.length > 1 ? "flex" : "none";
        }

        const thumbsContainer = document.getElementById("lightbox-thumbs");
        if (thumbsContainer) {
            thumbsContainer.innerHTML = eventImages.map((url, idx) => {
                if (isPdf(url)) {
                    return `<div class="lightbox-thumb pdf-thumb ${idx === currentImgIndex ? 'active' : ''}" onclick="selectLightboxImage(${idx})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span>PDF</span>
                    </div>`;
                }
                return `<img src="${url}" class="lightbox-thumb ${idx === currentImgIndex ? 'active' : ''}" onclick="selectLightboxImage(${idx})" alt="Thumb ${idx + 1}">`;
            }).join('');
        }
    }

    function selectLightboxImage(idx) {
        selectImage(idx);
        updateLightboxView();
    }

    function changeLightboxImage(dir, e) {
        if (e) e.stopPropagation();
        changeImage(dir, e);
        updateLightboxView();
    }

    function handleTouchStart(e) {
        if (currentScale > 1) return;
        if (e.changedTouches && e.changedTouches[0]) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }
    }

    function handleTouchEnd(e, isLightbox) {
        if (currentScale > 1) return;
        if (!e.changedTouches || !e.changedTouches[0]) return;
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 40) {
            if (diff > 0) {
                if (isLightbox) changeLightboxImage(1);
                else changeImage(1);
            } else {
                if (isLightbox) changeLightboxImage(-1);
                else changeImage(-1);
            }
        }
    }

    window.addEventListener("popstate", () => {
        const modal = document.getElementById("lightbox-modal");
        if (modal && modal.classList.contains("open")) {
            closeLightbox(true);
        }
    });

    window.addEventListener("keydown", (e) => {
        const modal = document.getElementById("lightbox-modal");
        if (modal && modal.classList.contains("open")) {
            if (e.key === "Escape") {
                closeLightbox();
            } else if (e.key === "ArrowLeft") {
                changeLightboxImage(-1);
            } else if (e.key === "ArrowRight") {
                changeLightboxImage(1);
            }
        }
    });

    function formatDateToHuman(dateVal) {
        if (!dateVal) return '';
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        function formatSingle(str) {
            if (!str) return '';
            const s = String(str).trim();
            let m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
            if (m) {
                const y = parseInt(m[1]);
                const mo = parseInt(m[2]) - 1;
                const d = parseInt(m[3]);
                if (mo >= 0 && mo < 12) return `${d} ${months[mo]} ${y}`;
            }
            m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
            if (m) {
                const d = parseInt(m[1]);
                const mo = parseInt(m[2]) - 1;
                const y = parseInt(m[3]);
                if (mo >= 0 && mo < 12) return `${d} ${months[mo]} ${y}`;
            }
            const parsed = new Date(s);
            if (!isNaN(parsed.getTime()) && s.length >= 8 && /\d/.test(s)) {
                return `${parsed.getDate()} ${months[parsed.getMonth()]} ${parsed.getFullYear()}`;
            }
            return s;
        }

        if (typeof dateVal === 'string' && dateVal.includes(' to ')) {
            return dateVal.split(' to ').map(formatSingle).join(' to ');
        }
        if (Array.isArray(dateVal)) {
            return dateVal.map(formatSingle).join(', ');
        }
        return formatSingle(dateVal);
    }

    function formatDaysDisplay(daysVal) {
        if (!daysVal) return '';
        let str = Array.isArray(daysVal) ? daysVal.join(', ') : String(daysVal).trim();
        if (!str) return '';

        const fullMap = {
            "monday": "Monday", "tuesday": "Tuesday", "wednesday": "Wednesday", "thursday": "Thursday", "friday": "Friday", "saturday": "Saturday", "sunday": "Sunday",
            "mon": "Monday", "tue": "Tuesday", "wed": "Wednesday", "thu": "Thursday", "thurs": "Thursday", "fri": "Friday", "sat": "Saturday", "sun": "Sunday"
        };

        let hasLeadingEvery = false;
        if (/^every\s+/i.test(str)) {
            hasLeadingEvery = true;
            str = str.replace(/^every\s+/i, '');
        }

        let daysArr = [];
        if (str.startsWith('[')) {
            try { daysArr = JSON.parse(str.replace(/'/g, '"')); } catch(e) { daysArr = str.split(/[\n,\s]+/); }
        } else {
            daysArr = str.split(/[\n,\s]+/);
        }

        let result = [];
        let containsWeekdays = false;
        daysArr.forEach(d => {
            let clean = d.trim();
            if (!clean) return;
            let lower = clean.toLowerCase().replace(/[^a-z]/g, '');
            if (fullMap[lower]) {
                result.push(fullMap[lower]);
                containsWeekdays = true;
            } else if (lower === "daily" || lower === "everyday" || lower === "every day") {
                result.push("Daily");
            } else {
                result.push(clean.charAt(0).toUpperCase() + clean.slice(1));
            }
        });

        if (result.length === 0) return '';
        if (result.includes("Daily")) return "Every day";

        let formatted = result.join(", ");
        if (containsWeekdays || hasLeadingEvery) {
            if (!formatted.toLowerCase().startsWith("every")) {
                formatted = "Every " + formatted;
            }
        }
        return formatted;
    }

    function render() {
        initMedia();
        const headerContainer = document.getElementById("event-header-container");
        const container = document.getElementById("event-content");
        const titleBadge = document.getElementById("sheet-title-badge");
        if (titleBadge) {
            titleBadge.textContent = event.title || "Event Details";
        }
        
        const cat = (event.category || '').toLowerCase().trim();
        const isWeeklyOrDaily = cat.includes('daily') || cat.includes('weekly') || (event.days && (event.days.toLowerCase().includes('daily') || event.days.toLowerCase().includes('everyday')));

        const rawDate = event.dates || event.startDate || event.date || '';
        const formattedDate = isWeeklyOrDaily ? '' : (rawDate ? formatDateToHuman(rawDate) : '');
        const formattedDays = event.days ? formatDaysDisplay(event.days) : '';

        // Render sticky header into event-header-container
        if (headerContainer) {
            headerContainer.innerHTML = `
            <!-- Segment 1: Type & Category -->
            <div class="ec-segment ec-above-title" style="padding: 12px 16px 4px;">
                <div class="ec-topbar">
                    <span class="ec-type">${event.type || 'EVENT'}</span>
                    <span class="ec-date">${event.category || ''}</span>
                </div>
            </div>
            
            <!-- Segment 2: Title (centered) -->
            <div class="ec-segment ec-title-segment" style="text-align: center; padding: 4px 16px 8px;">
                <strong style="display: block; text-align: center; font-size: 1.15rem; font-weight: 700; line-height: 1.35;">${event.title || 'Event Details'}</strong>
            </div>
            
            <!-- Segment 3: Below Title (only date or days, time and location in separate lines) -->
            <div class="ec-segment ec-below-title" style="display: flex; flex-direction: column; gap: 4px; padding: 0 16px 12px; border-bottom: 1px solid var(--border);">
                ${formattedDate || formattedDays ? `<div style="font-size: 0.9rem; line-height: 1.3;"><span style="font-weight: 700;">📅 Date:</span> <span style="font-weight: 500; color: var(--text-secondary);">${formattedDate || formattedDays}</span></div>` : ''}
                ${event.times ? `<div style="font-size: 0.9rem; line-height: 1.3;"><span style="font-weight: 700;">🕒 Time:</span> <span style="font-weight: 500; color: var(--text-secondary);">${event.times}</span></div>` : ''}
                ${event.venue ? `<div style="font-size: 0.9rem; line-height: 1.3;"><span style="font-weight: 700;">📍 Location:</span> <span style="font-weight: 500; color: var(--text-secondary);">${event.venue}</span></div>` : ''}
            </div>`;
        }

        let html = `<div class="event-card">`;

        // 2. Media Carousel to occupy full screen width with no padding or empty/vacant space on left or right.
        if (eventImages.length > 0) {
            const firstUrl = eventImages[0];
            const isFirstPdf = isPdf(firstUrl);

            html += `
            <div class="media-gallery-container">
                <div class="media-main-frame" id="media-main-frame" ontouchstart="handleTouchStart(event)" ontouchend="handleTouchEnd(event, false)">
                    <div id="main-media-view-container" class="main-media-view-container">
                    ${isFirstPdf ? `
                        <div class="pdf-media-wrapper" onclick="openLightbox(0)">
                            <canvas id="main-pdf-canvas" class="pdf-canvas-display"></canvas>
                            <div class="pdf-click-overlay">
                                <span class="pdf-overlay-badge">📄 PDF Document • Tap for Full View</span>
                            </div>
                        </div>
                    ` : `
                        <img id="main-display-image" class="main-display-img" src="${firstUrl}" alt="${event.title || 'Event Image'}" onclick="openLightbox(0)">
                    `}
                    </div>
                    <button type="button" onclick="shareEvent()" title="Share Event" aria-label="Share Event" style="position: absolute; top: 12px; right: 12px; z-index: 5; background: rgba(0, 0, 0, 0.55); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px); box-shadow: 0 2px 6px rgba(0,0,0,0.3);">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                    </button>`;

            if (eventImages.length > 1) {
                html += `<button type="button" class="media-nav-btn media-nav-prev" onclick="changeImage(-1, event)" aria-label="Previous Image">‹</button>
                         <button type="button" class="media-nav-btn media-nav-next" onclick="changeImage(1, event)" aria-label="Next Image">›</button>
                         <div class="image-counter-badge" id="image-counter-badge">1 of ${eventImages.length}</div>`;
            } else {
                html += `<div class="image-counter-badge" id="image-counter-badge">1 of 1</div>`;
            }

            html += `</div>`;

            if (eventImages.length > 1) {
                html += `
                <div class="thumbnails-strip-container" style="padding: 0 16px; margin-top: 10px;">
                    <div class="thumbnails-strip" id="thumbnails-strip">`;
                
                eventImages.forEach((imgUrl, idx) => {
                    const isItemPdf = isPdf(imgUrl);
                    if (isItemPdf) {
                        html += `<div class="thumbnail-item pdf-thumb ${idx === 0 ? 'active' : ''}" onclick="selectImage(${idx})" id="thumb-${idx}">
                            <canvas id="thumb-pdf-canvas-${idx}" style="width:100%; height:100%; object-fit:cover; display:block;"></canvas>
                            <span class="pdf-thumb-label">PDF</span>
                        </div>`;
                    } else {
                        html += `<div class="thumbnail-item ${idx === 0 ? 'active' : ''}" onclick="selectImage(${idx})" id="thumb-${idx}">
                            <img src="${imgUrl}" alt="Thumbnail ${idx + 1}" loading="lazy">
                        </div>`;
                    }
                });

                html += `</div></div>`;
            }
            
            html += `</div>`;
        }

        // 3. Below media and above description:
        // Remaining fields and Contact block
        // Two-column CSS Grid to ensure contact is always top-right aligned on any screens
        html += `<div class="details-mid-section" style="display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 16px; align-items: start;">`;

        // Remaining fields column:
        html += `<div class="remaining-fields" style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">`;

        if (event.cost) {
            html += `
            <div class="detail-row" style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
                <span class="detail-label" style="font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; white-space: nowrap;">Contribution:</span>
                <span style="font-size: 0.9rem; line-height: 1.3; font-weight: 500; color: var(--text-secondary); text-decoration: none;">${event.cost}</span>
            </div>`;
        }
        if (event.audience) {
            html += `
            <div class="detail-row" style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;">
                <span class="detail-label" style="font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; white-space: nowrap;">Key info:</span>
                <span style="font-size: 0.9rem; line-height: 1.3; font-weight: 500; color: var(--text-secondary); text-decoration: none;">${event.audience}</span>
            </div>`;
        }

        if (eventDocs.length > 0) {
            html += `
            <div class="detail-row" style="margin-bottom: 4px;">
                <span class="detail-label" style="font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; display: block; margin-bottom: 4px;">Attached Documents</span>
                <div style="display: flex; flex-direction: column; gap: 6px;">`;
            eventDocs.forEach((docUrl, i) => {
                const name = docUrl.split('/').pop().split('?')[0].replace(/^event-media\/\d+_/, "");
                html += `<a href="${docUrl}" target="_blank" style="font-size: 0.9rem; line-height: 1.3; font-weight: 500; color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">📄 ${name || ('Document ' + (i+1))}</a>`;
            });
            html += `</div></div>`;
        }

        let rawWebsite = event.website || event.externalLinks || event.links || '';
        let linksList = [];
        if (Array.isArray(rawWebsite)) {
            linksList = rawWebsite.map(String).map(s => s.trim()).filter(Boolean);
        } else if (typeof rawWebsite === 'string' && rawWebsite.trim()) {
            linksList = rawWebsite.split(/[\n,\s]+/).map(s => s.trim()).filter(Boolean);
        }

        if (linksList.length > 0) {
            html += `
            <div class="detail-row" style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; flex-wrap: wrap;">
                <span class="detail-label" style="font-weight: 700; color: var(--text-secondary); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.05em; white-space: nowrap;">External links:</span>
                <div style="display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: baseline;">`;
            linksList.forEach((link, idx) => {
                const fullUrl = link.startsWith('http') ? link : 'https://' + link;
                let displayUrl = link.replace(/^https?:\/\//i, '').replace(/\/$/, '');
                if (displayUrl.length > 30) displayUrl = displayUrl.substring(0, 27) + '...';
                html += `<a href="${fullUrl}" target="_blank" style="font-size: 0.9rem; line-height: 1.3; font-weight: 500; color: var(--text-secondary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">🔗 ${displayUrl || fullUrl}</a>`;
                if (idx < linksList.length - 1) {
                    html += `<span style="color: var(--text-secondary); font-size: 0.8rem; margin: 0 2px;">|</span>`;
                }
            });
            html += `</div></div>`;
        }

        html += `</div>`; // End of remaining-fields column

        // Contact Column on Right:
        if (event.contactPerson || event.whatsapp || event.contact || event.phone || event.email) {
            html += `
            <div class="contact-sidebar" style="display: flex; flex-direction: column; gap: 6px; align-items: flex-end; text-align: right; max-width: 200px; min-width: 140px;">`;
            
            if (event.contactPerson) {
                html += `
                <div style="display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; margin-bottom: 4px;">
                    <span style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); white-space: nowrap;">Contact:</span>
                    <span style="font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); line-height: 1.3;">${event.contactPerson}</span>
                </div>`;
            } else {
                html += `
                <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 4px;">Contact</div>`;
            }
            
            if (event.whatsapp) {
                const cleanWa = String(event.whatsapp).replace(/^https?:\/\/wa\.me\//i, '').replace(/[^0-9+]/g, '');
                const waDisplay = cleanWa ? (cleanWa.startsWith('+') ? cleanWa : '+' + cleanWa) : event.whatsapp;
                const waNumber = cleanWa.replace(/[^0-9]/g, '');
                const waHref = "https://wa.me/" + waNumber;
                html += `<div style="font-size: 0.9rem; line-height: 1.3;"><a href="${waHref}" target="_blank" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">${waDisplay}</a></div>`;
            }
            
            if (event.contact || event.phone) {
                const phoneVal = String(event.contact || event.phone).trim();
                if (phoneVal !== event.whatsapp) {
                    const telVal = phoneVal.replace(/[^0-9+]/g, '');
                    html += `<div style="font-size: 0.9rem; line-height: 1.3;"><a href="tel:${telVal}" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">${phoneVal}</a></div>`;
                }
            }
            
            if (event.email) {
                html += `<div style="font-size: 0.9rem; line-height: 1.3; word-break: break-all;"><a href="mailto:${event.email.trim()}" style="color: var(--text-secondary); text-decoration: none; font-weight: 500;">${event.email.trim()}</a></div>`;
            }
            
            html += `</div>`;
        }

        html += `</div>`; // End of details-mid-section

        // 4. Description at the bottom
        const descText = event.description || 
                         (event.originalHeaders ? (event.originalHeaders.description || event.originalHeaders.details || event.originalHeaders.about || event.originalHeaders['event description'] || event.originalHeaders['description / details'] || '') : '');
        if (descText) {
            html += `
            <div class="description" style="margin: 8px 16px 16px; padding-top: 16px; border-top: 1px solid var(--border); white-space: pre-wrap; font-size: 0.95rem; line-height: 1.5; color: var(--text);">
                ${descText}
            </div>`;
        }

        // Floating Action Buttons (email/whatsapp buttons)
        const floatingContainer = document.getElementById("floating-contact-container");
        if (floatingContainer) {
            let floatingHtml = '';
            if (event.email || event.whatsapp) {
                const eventTitle = event.title || 'Event';
                const dateOrDay = formattedDate || formattedDays || '';
                const locationStr = event.venue || '';
                
                let datePart = dateOrDay ? ` on "${dateOrDay}"` : '';
                let locationPart = locationStr ? ` at ${locationStr}` : '';
                const draftMessage = `Hi! I came across the "${eventTitle}" event to be held${datePart}${locationPart} on auroconnect.info. Could I please get more details?`;
                
                if (event.whatsapp) {
                    let waHref = "";
                    if (event.whatsapp.startsWith("http")) {
                        try {
                            const url = new URL(event.whatsapp);
                            url.searchParams.set("text", draftMessage);
                            waHref = url.toString();
                        } catch(e) {
                            waHref = event.whatsapp;
                        }
                    } else {
                        const waNumber = event.whatsapp.replace(/[^0-9]/g, '');
                        waHref = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(draftMessage);
                    }
                    floatingHtml += `
                    <a href="${waHref}" target="_blank" class="floating-contact-btn whatsapp-btn" aria-label="WhatsApp Organizer">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </a>`;
                }
                
                if (event.email) {
                    const mailHref = "mailto:" + event.email.trim() + "?subject=" + encodeURIComponent("Inquiry regarding: " + eventTitle) + "&body=" + encodeURIComponent(draftMessage);
                    floatingHtml += `
                    <a href="${mailHref}" target="_blank" class="floating-contact-btn email-btn" aria-label="Email Organizer">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </a>`;
                }
            }
            floatingContainer.innerHTML = floatingHtml;
        }

        html += `</div>`; // End of .event-card

        container.innerHTML = html;
        const mainImg = document.getElementById("main-display-image");
        if (mainImg) {
            attachTouchZoomHandlers(mainImg);
        }

        if (eventImages.length > 0) {
            if (isPdf(eventImages[0])) {
                const mainCanvas = document.getElementById("main-pdf-canvas");
                renderPdfToCanvas(eventImages[0], mainCanvas, { scale: 1.8 });
            }
            eventImages.forEach((imgUrl, idx) => {
                if (isPdf(imgUrl)) {
                    const thumbCanvas = document.getElementById(`thumb-pdf-canvas-${idx}`);
                    if (thumbCanvas) {
                        renderPdfToCanvas(imgUrl, thumbCanvas, { scale: 0.8 });
                    }
                }
            });
        }
    }
    
    function copyEventLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("Link copied!");
        }).catch(() => {
            alert("Failed to copy.");
        });
    }

    function shareEvent() {
        if (navigator.share) {
            navigator.share({
                title: event.title,
                url: window.location.href
            }).catch(() => copyEventLink());
        } else {
            copyEventLink();
        }
    }

    function closeSheet() {
        const sheet = document.getElementById("details-sheet");
        const backdrop = document.getElementById("main-content");
        if (sheet && backdrop) {
            sheet.style.transform = "translateY(100%)";
            sheet.style.transition = "transform 0.25s ease-in";
            backdrop.style.opacity = "0";
            backdrop.style.transition = "opacity 0.25s ease-in";
            setTimeout(() => {
                if (window.history.length > 1 && document.referrer && document.referrer.includes(window.location.host)) {
                    window.history.back();
                } else {
                    window.location.href = "/";
                }
            }, 220);
        } else {
            window.location.href = "/";
        }
    }

    function handleBackdropClick(e) {
        if (e.target.id === "main-content") {
            closeSheet();
        }
    }

    let dragStartY = 0;
    let dragCurrentY = 0;
    let isDraggingSheet = false;

    function initSheetDrag() {
        const header = document.getElementById("sheet-header-bar");
        const sheet = document.getElementById("details-sheet");
        if (!header || !sheet) return;

        header.addEventListener("touchstart", (e) => {
            if (e.touches.length === 1) {
                dragStartY = e.touches[0].clientY;
                isDraggingSheet = true;
                sheet.style.transition = "none";
            }
        }, { passive: true });

        window.addEventListener("touchmove", (e) => {
            if (!isDraggingSheet) return;
            const deltaY = e.touches[0].clientY - dragStartY;
            if (deltaY > 0) {
                dragCurrentY = deltaY;
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        }, { passive: true });

        window.addEventListener("touchend", () => {
            if (!isDraggingSheet) return;
            isDraggingSheet = false;
            sheet.style.transition = "transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)";
            if (dragCurrentY > 100) {
                closeSheet();
            } else {
                sheet.style.transform = "translateY(0)";
            }
            dragCurrentY = 0;
        });
    }

    window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            const lightbox = document.getElementById("lightbox-modal");
            if (lightbox && lightbox.classList.contains("open")) {
                closeLightbox();
            } else {
                closeSheet();
            }
        }
    });

    render();
    initSheetDrag();
</script>
<script src="/common.js" type="module"></script>
</body>
</html>
