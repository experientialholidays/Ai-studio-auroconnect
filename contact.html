    <script>
      (function() {
        const wrapConsole = (method) => {
          const original = console[method];
          if (!original) return;
          console[method] = function(...args) {
            const sanitizedArgs = args.map(arg => {
              if (arg && typeof arg === "object") {
                try {
                  const constrName = arg.constructor ? arg.constructor.name : "";
                  if (constrName === "Y" || constrName === "Ka" || constrName === "Ia" || constrName.includes("Firestore") || constrName.includes("Firebase")) {
                    return `[Firebase/Firestore Object: ${constrName}]`;
                  }
                  JSON.stringify(arg);
                  return arg;
                } catch (e) {
                  return `[Circular Object: ${arg.constructor ? arg.constructor.name : "Object"}]`;
                }
              }
              return arg;
            });
            return original.apply(this, sanitizedArgs);
          };
        };
        wrapConsole("log");
        wrapConsole("warn");
        wrapConsole("error");
      })();
    </script>

    <style>
      :root {
        --accent: #C85A32;
        --bg: #F5F0EB;
        --surface: #FFFFFF;
        --text: #3D2314;
        --text-secondary: #6E5D4F;
        --border: #E6DDD5;
        --shadow: rgba(61, 35, 20, 0.08);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1A1715;
          --surface: #24201D;
          --text: #F5E8DF;
          --text-secondary: #C4B5A5;
          --border: #3A342E;
          --accent: #E07A5F;
          --shadow: rgba(0, 0, 0, 0.4);
        }
      }

      html {
        font-size: 100%;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
      }

      .container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 2.5rem;
        margin-top: 3rem;
        margin-bottom: 3rem;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 4px 6px var(--shadow);
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        box-sizing: border-box;
      }

      .container h2 {
        margin: 0;
        font-size: 1.5rem;
        text-align: center;
        color: var(--text);
      }

      .container p {
        color: var(--text-secondary);
        margin: -0.5rem 0 0.5rem 0;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.4;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: 100%;
      }

      .form-group label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .form-group input, .form-group textarea {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        outline: none;
        font-size: 0.95rem;
        font-family: inherit;
        transition: border-color 0.2s;
      }

      .form-group input:focus, .form-group textarea:focus {
        border-color: var(--accent);
      }

      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border-radius: 2rem;
        cursor: pointer;
        font-weight: 600;
        width: 100%;
        transition: opacity 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .btn:hover {
        opacity: 0.9;
      }

      @media (prefers-color-scheme: dark) {
        .btn {
          color: #000;
          background: var(--accent);
        }
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status-message {
        font-size: 0.9rem;
        text-align: center;
        padding: 0.75rem;
        border-radius: 8px;
        display: none;
        line-height: 1.4;
      }

      #status-message.success {
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #10b981;
        display: block;
      }

      #status-message.error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        color: #ef4444;
        display: block;
      }
      @media (max-width: 480px) {
        .container {
          padding: 1.25rem;
          margin-top: 1.5rem;
          margin-bottom: 1.5rem;
        }
      }
    </style>

  <body>
    <!-- Injected header will go here via common.js -->

    <div class="container">
      <h2>📬 Contact AuroConnect</h2>
      <p>Have questions, feedback, or need support? Drop us a message below and our team will get back to you.</p>

      <form id="contact-form">
        <div class="form-group">
          <label for="contact-name">Your Name</label>
          <input type="text" id="contact-name" placeholder="John Doe" required />
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="contact-email">Email Address</label>
          <input type="email" id="contact-email" placeholder="john@example.com" required />
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="contact-phone">Mobile Number</label>
          <div style="display: flex; gap: 0.5rem; width: 100%; box-sizing: border-box;">
            <input type="text" id="contact-country-code" list="country-codes-list" value="+91" placeholder="+91" style="padding: 0.75rem 0.5rem; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; font-size: 0.95rem; font-family: inherit; width: 80px; flex-shrink: 0; text-align: center; box-sizing: border-box;" required />
            <datalist id="country-codes-list">
              <option value="+91">India (+91)</option>
              <option value="+1">USA/Canada (+1)</option>
              <option value="+44">UK (+44)</option>
              <option value="+971">UAE (+971)</option>
              <option value="+33">France (+33)</option>
              <option value="+49">Germany (+49)</option>
              <option value="+61">Australia (+61)</option>
              <option value="+65">Singapore (+65)</option>
              <option value="+81">Japan (+81)</option>
              <option value="+7">Russia (+7)</option>
              <option value="+86">China (+86)</option>
            </datalist>
            <input type="tel" id="contact-phone" placeholder="9876543210" style="flex: 1; min-width: 0; box-sizing: border-box;" required />
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="contact-subject">Subject</label>
          <input type="text" id="contact-subject" placeholder="Feedback/Event issue..." required />
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" rows="5" placeholder="Write your message here..." required></textarea>
        </div>

        <div id="status-message" style="margin-top: 1rem;"></div>

        <button type="submit" id="submit-btn" class="btn" style="margin-top: 1.5rem;">
          Send Message
        </button>
      </form>
    </div>

    <!-- Firebase SDKs and Firestore Submission Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
      import { getFirestore, setLogLevel, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
      setLogLevel("silent");

      const firebaseConfig = {
        apiKey: "AIzaSyDZ87VkavGphOCIOfD3a-nhOSxI2wcpuMg",
        authDomain: "auro-connect.firebaseapp.com",
        projectId: "auro-connect",
        storageBucket: "auro-connect.firebasestorage.app",
        messagingSenderId: "913005987760",
        appId: "1:913005987760:web:57d4210ef370a817e33875",
        measurementId: "G-S4L4Z530CS"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const contactForm = document.getElementById("contact-form");
      const submitBtn = document.getElementById("submit-btn");
      const statusMsg = document.getElementById("status-message");

      contactForm.onsubmit = async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = "Sending...";
        statusMsg.style.display = "none";
        statusMsg.className = "";

        const name = document.getElementById("contact-name").value.trim();
        const email = document.getElementById("contact-email").value.trim();
        const phone = document.getElementById("contact-country-code").value + " " + document.getElementById("contact-phone").value.trim();
        const subject = document.getElementById("contact-subject").value.trim();
        const message = document.getElementById("contact-message").value.trim();

        try {
          await addDoc(collection(db, "contact_messages"), {
            name,
            email,
            phone,
            subject,
            message,
            timestamp: serverTimestamp()
          });

          statusMsg.innerText = "Thank you! Your message has been sent successfully. We'll get back to you soon.";
          statusMsg.className = "success";
          contactForm.reset();
        } catch (err) {
          console.error("Firestore submission error:", err);
          statusMsg.innerText = "Failed to send message: " + err.message;
          statusMsg.className = "error";
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = "Send Message";
        }
      };
    </script>

    <!-- Injected header and footer script -->
    <script src="/common.js" type="module"></script>
  </body>
